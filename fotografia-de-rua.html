<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thiago Botelho Fotografia | O olhar que permanece</title>
<meta name="description" content="Thiago Botelho Fotografia: retratos, fotografia de rua, palcos, esportes, natureza, eventos e gastronomia. Obras Fine Art em papel Canson com certificado de autenticidade.">
<meta name="theme-color" content="#0e0d0c">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Thiago Botelho Fotografia">
<meta property="og:description" content="Fotografias que transformam instantes em memória. Portfólio, vlog Contando Histórias e Loja Fine Art.">
<meta property="og:locale" content="pt_BR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"ProfessionalService","name":"Thiago Botelho Fotografia","description":"Fotografia autoral: retratos, rua, palcos, esportes, natureza, eventos, gastronomia e obras Fine Art.","telephone":"+55 86 98886-2416"}</script>
<style>
:root{
  --bg:#0e0d0c;--bg2:#141210;--bg3:#1b1815;--line:#2b2620;--line2:#4a3e2d;
  --gold:#c7aa7b;--gold2:#e4cb98;--ink:#eee8dd;--muted:#a79f92;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:Manrope,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --pad:clamp(20px,6vw,100px);--hh:78px;--ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
img{max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
::selection{background:var(--gold);color:#13100c}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.skip{position:fixed;left:12px;top:-60px;background:var(--gold);color:#12100c;padding:10px 16px;z-index:300;font-weight:700;font-size:13px;transition:top .2s}
.skip:focus{top:12px}
.eyebrow{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:600}
.muted{color:var(--muted)}

/* ---------- Header ---------- */
#hdr{position:fixed;inset:0 0 auto 0;z-index:100;height:var(--hh);display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);transition:background .35s,border-color .35s,backdrop-filter .35s;border-bottom:1px solid transparent}
#hdr.solid{background:rgba(14,13,12,.82);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-color:var(--line)}
.brand{font-family:var(--serif);font-size:25px;line-height:.9;letter-spacing:.13em;white-space:nowrap}
.brand small{display:block;font:600 8.5px var(--sans);letter-spacing:.5em;color:var(--gold);margin-top:9px}
#nav{display:flex;align-items:center;gap:clamp(18px,2.4vw,34px)}
#nav a{font-size:11px;letter-spacing:.15em;text-transform:uppercase;position:relative;padding:6px 0;font-weight:500}
#nav a:not(.cta)::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;background:var(--gold);transition:right .35s var(--ease)}
#nav a:not(.cta):hover::after,#nav a[aria-current="page"]::after{right:0}
#nav a:hover{color:var(--gold2)}
#nav a[aria-current="page"]{color:var(--gold2)}
#nav .cta{border:1px solid var(--gold);color:var(--gold);padding:11px 18px;transition:.25s}
#nav .cta:hover{background:var(--gold);color:#13100c}
.burger{display:none;width:44px;height:44px;background:none;border:0;cursor:pointer;position:relative;z-index:120}
.burger span{position:absolute;left:11px;right:11px;height:1.5px;background:var(--ink);transition:transform .35s var(--ease),opacity .2s,top .35s var(--ease)}
.burger span:nth-child(1){top:16px}.burger span:nth-child(2){top:22px}.burger span:nth-child(3){top:28px}
.burger[aria-expanded="true"] span:nth-child(1){top:22px;transform:rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){top:22px;transform:rotate(-45deg)}
@media(max-width:900px){
  .burger{display:block}
  #nav{position:fixed;inset:0;background:rgba(10,9,8,.97);flex-direction:column;justify-content:center;gap:8px;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;z-index:110}
  #nav.open{opacity:1;visibility:visible}
  #nav a{font:400 40px var(--serif);letter-spacing:.01em;text-transform:none;padding:8px 0}
  #nav .cta{margin-top:18px;font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:16px 28px}
  #nav a::after{display:none}
}

/* ---------- Layout ---------- */
main{min-height:70vh;outline:none}
.view{animation:viewIn .7s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sec{padding:clamp(70px,10vw,130px) var(--pad);scroll-margin-top:calc(var(--hh) - 8px)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:clamp(30px,4vw,52px);flex-wrap:wrap}
.sec-head h2{font-size:clamp(46px,6.5vw,92px);line-height:.98;margin-top:14px}
.sec-head p{max-width:380px;color:var(--muted);font-size:14px;line-height:1.85}
.btn{display:inline-flex;align-items:center;gap:10px;padding:17px 28px;border:1px solid var(--gold);color:var(--gold);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;cursor:pointer;background:transparent;transition:background .25s,color .25s,transform .25s}
.btn:hover{background:var(--gold);color:#13100c}
.btn.solid{background:var(--gold);color:#13100c}
.btn.solid:hover{background:var(--gold2);border-color:var(--gold2)}
.btn.block{display:flex;justify-content:center;width:100%}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden;background:#000}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 40%;animation:kb 22s ease-out both}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.78) 0,rgba(0,0,0,0) 190px),linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.18) 55%,rgba(0,0,0,0) 80%),linear-gradient(0deg,rgba(14,13,12,1) 0%,rgba(14,13,12,0) 38%)}
.hero-copy{position:relative;z-index:2;padding:0 var(--pad) clamp(70px,11vh,130px);max-width:980px}
.hero h1{font-size:clamp(66px,11.5vw,168px);line-height:.88;letter-spacing:-.035em;margin:22px 0 28px}
.hero h1 em{font-weight:300;color:var(--gold)}
.hero p{max-width:470px;color:#cfc7ba;font-size:15px;line-height:1.85}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.cue{position:absolute;z-index:2;right:var(--pad);bottom:34px;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);writing-mode:vertical-rl}
.cue i{display:block;width:1px;height:56px;background:linear-gradient(var(--gold),transparent);animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media(max-width:900px){
  .hero img{object-position:68% 30%}
  .hero::after{background:linear-gradient(180deg,rgba(0,0,0,.7) 0,rgba(0,0,0,0) 130px),linear-gradient(0deg,rgba(14,13,12,1) 4%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.1) 80%)}
  .cue{display:none}
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line);background:var(--bg2)}
.stat{padding:30px var(--pad);text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border:0}
.stat b{display:block;font:300 clamp(38px,4.6vw,64px)/1 var(--serif);color:var(--gold2)}
.stat span{display:block;margin-top:8px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
@media(max-width:560px){.stat{padding:22px 8px}.stat span{letter-spacing:.14em;font-size:9px}}

/* ---------- Fine Art 3D carousel ---------- */
.showcase{background:radial-gradient(ellipse at 50% 30%,#2a241c 0%,var(--bg) 68%);padding:clamp(70px,9vw,120px) 0 clamp(60px,8vw,100px);overflow:hidden}
.showcase .sec-head{padding:0 var(--pad)}
.stage{position:relative;height:clamp(420px,52vw,660px);perspective:1500px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;outline:none}
.stage.dragging{cursor:grabbing}
.card3{position:absolute;top:50%;left:50%;width:min(40vw,470px);height:92%;display:flex;align-items:center;justify-content:center;background:var(--bg3);border:1px solid #5d4d35;box-shadow:0 30px 80px #000a;transition:transform .8s var(--ease),opacity .6s,filter .6s;will-change:transform;overflow:hidden;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.5)}
.card3 img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}
.card3[data-pos="0"]{transform:translate(-50%,-50%) translateZ(120px);opacity:1;z-index:4;pointer-events:auto;border-color:var(--gold);box-shadow:0 40px 100px #000d,0 0 0 1px var(--gold)}
.card3[data-pos="-1"]{transform:translate(-50%,-50%) translateX(-80%) rotateY(32deg) scale(.74);opacity:.55;filter:brightness(.6);z-index:3;pointer-events:auto}
.card3[data-pos="1"]{transform:translate(-50%,-50%) translateX(80%) rotateY(-32deg) scale(.74);opacity:.55;filter:brightness(.6);z-index:3;pointer-events:auto}
.card3[data-pos="-2"]{transform:translate(-50%,-50%) translateX(-135%) rotateY(40deg) scale(.5);z-index:1}
.card3[data-pos="2"]{transform:translate(-50%,-50%) translateX(135%) rotateY(-40deg) scale(.5);z-index:1}
.art-cap{text-align:center;padding:30px var(--pad) 0;max-width:720px;margin:0 auto}
.art-cap h3{font-size:clamp(32px,3.6vw,48px);line-height:1.05}
.art-cap p{color:var(--muted);margin-top:8px;font-size:14px}
.art-cap .btn{margin-top:22px}
.art-ctl{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:30px}
.arrow{width:48px;height:48px;border-radius:50%;background:transparent;border:1px solid var(--line2);color:var(--gold);font-size:20px;cursor:pointer;transition:.25s;display:grid;place-items:center}
.arrow:hover{background:var(--gold);color:#13100c;border-color:var(--gold)}
.dots{display:flex;gap:10px;align-items:center}
.dot{height:7px;width:7px;border:0;border-radius:6px;background:#675c4d;cursor:pointer;padding:0;transition:width .35s var(--ease),background .3s}
.dot.on{background:var(--gold);width:30px}
@media(max-width:760px){
  .stage{height:min(135vw,540px)}
  .card3{width:68vw}
  .card3[data-pos="-1"]{transform:translate(-50%,-50%) translateX(-68%) rotateY(30deg) scale(.66)}
  .card3[data-pos="1"]{transform:translate(-50%,-50%) translateX(68%) rotateY(-30deg) scale(.66)}
  .card3[data-pos="0"]{transform:translate(-50%,-50%) translateZ(60px)}
}

/* ---------- Gallery cards (home) ---------- */
.gg{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.gc{position:relative;overflow:hidden;background:var(--bg3);min-height:clamp(260px,31vw,440px);display:block;grid-column:span 4;isolation:isolate}
.gc:nth-child(1){grid-column:span 7}.gc:nth-child(2){grid-column:span 5}
.gc:nth-child(6),.gc:nth-child(7){grid-column:span 6}
.gc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease),filter .6s;z-index:-2}
.gc::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.82),rgba(0,0,0,.05) 62%);z-index:-1;transition:opacity .4s}
.gc:hover img{transform:scale(1.06)}
.gc-n{position:absolute;top:20px;left:22px;font-size:10px;letter-spacing:.28em;color:var(--gold2);font-weight:600}
.gc-b{position:absolute;left:0;right:0;bottom:0;padding:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
.gc h3{font-size:clamp(34px,3.6vw,56px);line-height:1}
.gc small{display:block;margin-top:8px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#d7cdbd}
.gc-go{width:46px;height:46px;border:1px solid rgba(255,255,255,.4);border-radius:50%;display:grid;place-items:center;flex:none;transition:.3s;font-size:17px}
.gc:hover .gc-go{background:var(--gold);color:#13100c;border-color:var(--gold);transform:rotate(-45deg)}
@media(max-width:900px){.gc,.gc:nth-child(n){grid-column:span 6}.gc:nth-child(7){grid-column:span 12}}
@media(max-width:600px){.gg{gap:10px}.gc,.gc:nth-child(n){grid-column:span 12;min-height:250px}}

/* ---------- Stories teaser ---------- */
.story-band{background:linear-gradient(135deg,#15130f,#26211a);border-block:1px solid var(--line)}
.split{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(30px,6vw,90px);align-items:center;max-width:1300px;margin:0 auto}
.frame{position:relative}
.frame img{display:block;width:100%;height:auto;box-shadow:0 30px 70px #0009}
.frame::after{content:"";position:absolute;inset:14px -14px -14px 14px;border:1px solid var(--line2);z-index:-1}
.split h2{font-size:clamp(44px,5.5vw,80px);line-height:1;margin:16px 0 22px}
.split p.lead{color:#cfc5b6;font-size:16px;line-height:1.9;margin-bottom:30px}
@media(max-width:860px){.split{grid-template-columns:1fr}.frame::after{inset:10px -8px -10px 10px}}

/* ---------- Fine Art explainer ---------- */
.fa-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,60px);align-items:start;max-width:1300px;margin:0 auto}
.fa-ex{border-left:2px solid var(--gold);padding:6px 0 6px clamp(18px,2.4vw,32px)}
.fa-ex h3{font-size:clamp(34px,4vw,52px);line-height:1.05;margin-bottom:16px}
.fa-ex p{color:#c9c1b4;font-size:14.5px;line-height:1.95;margin-top:12px}
.fa-ex .btn{margin-top:28px}
.ben{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ben div{border:1px solid var(--line2);background:linear-gradient(150deg,#241f19,#171512);padding:24px 22px}
.ben i{font:normal 500 11px var(--sans);color:var(--gold);letter-spacing:.24em}
.ben h4{font:600 14.5px/1.45 var(--sans);color:#dcc496;margin:12px 0 10px}
.ben p{font-size:12.5px;line-height:1.75;color:#b8afa1}
@media(max-width:900px){.fa-grid{grid-template-columns:1fr}}
@media(max-width:480px){.ben{grid-template-columns:1fr}}

/* ---------- About ---------- */
.about{background:var(--bg2);border-top:1px solid var(--line)}
.about .split{grid-template-columns:.8fr 1.2fr}
.about blockquote{font:italic 300 clamp(30px,3.6vw,54px)/1.1 var(--serif);margin:24px 0 28px;color:var(--gold2)}
.bio p{color:#b9b0a2;font-size:15px;line-height:1.95;margin-bottom:16px}
.about .frame img{box-shadow:0 30px 70px #000b}
@media(max-width:860px){.about .split{grid-template-columns:1fr}}

/* ---------- CTA band ---------- */
.cta-band{text-align:center;background:radial-gradient(ellipse at 50% 0,#2b251c,var(--bg) 70%)}
.cta-band h2{font-size:clamp(46px,7vw,104px);line-height:.95;margin:18px auto 22px;max-width:900px}
.cta-band h2 em{color:var(--gold);font-weight:300}
.cta-band p{max-width:520px;margin:0 auto 34px;color:var(--muted);font-size:15px;line-height:1.85}

/* ---------- Footer ---------- */
footer{border-top:1px solid var(--line);padding:46px var(--pad) 36px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:30px;color:var(--muted);font-size:13px;background:var(--bg)}
footer .brand{color:var(--ink)}
footer h5{margin:0 0 14px;font:600 10px var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
footer a:hover{color:var(--gold2)}
.copy{grid-column:1/-1;border-top:1px solid var(--line);padding-top:22px;font-size:11.5px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
@media(max-width:700px){footer{grid-template-columns:1fr 1fr}footer>div:first-child{grid-column:1/-1}}

/* ---------- Page header (inner pages) ---------- */
.ph-hero{padding:calc(var(--hh) + clamp(60px,9vw,120px)) var(--pad) clamp(40px,5vw,70px);text-align:center;background:radial-gradient(ellipse at 50% 0,#28221a,var(--bg) 72%)}
.ph-hero h1{font-size:clamp(62px,10.5vw,150px);line-height:.95;margin:18px 0 16px;letter-spacing:-.03em}
.ph-hero h1 em{color:var(--gold);font-weight:300}
.ph-hero p{max-width:620px;margin:0 auto;color:var(--muted);line-height:1.85}
.count{display:inline-block;margin-top:22px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold2);border:1px solid var(--line2);padding:8px 16px}
.crumb{display:inline-flex;gap:10px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.crumb a:hover{color:var(--gold2)}

/* ---------- Gallery page ---------- */
.chips{display:flex;gap:10px;overflow-x:auto;padding:0 var(--pad) 8px;scrollbar-width:none;margin-bottom:34px;justify-content:safe center}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:11px 18px;border:1px solid var(--line2);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);transition:.25s;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--gold)}
.chip[aria-current="page"]{background:var(--gold);color:#13100c;border-color:var(--gold);font-weight:700}
.masonry{columns:3;column-gap:16px;padding:0 clamp(14px,3.5vw,60px) 40px;max-width:1700px;margin:0 auto}
.ph{display:block;width:100%;margin:0 0 16px;padding:0;border:0;background:var(--bg3);break-inside:avoid;cursor:zoom-in;overflow:hidden;position:relative;min-height:240px}
.ph.ok{min-height:0}
.ph img{display:block;width:100%;height:auto;opacity:0;transform:scale(1.02);transition:opacity .8s var(--ease),transform 1s var(--ease)}
.ph.ok img{opacity:1;transform:none}
.ph.ok:hover img{transform:scale(1.035)}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.35),transparent 40%);opacity:0;transition:opacity .4s;pointer-events:none}
.ph.ok:hover::after{opacity:1}
.ph.bad{cursor:default;min-height:220px;display:grid;place-items:center;color:#5d554a;font-size:11px;letter-spacing:.2em;text-transform:uppercase;background:repeating-linear-gradient(135deg,#171513 0 12px,#1a1815 12px 24px)}
.ph.bad img{display:none}
.ph.bad::before{content:"Foto " attr(data-n)}
.next-g{display:block;position:relative;overflow:hidden;margin:30px var(--pad) 0;min-height:240px;isolation:isolate;background:var(--bg3)}
.next-g img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.1s var(--ease)}
.next-g::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.25));z-index:-1}
.next-g:hover img{transform:scale(1.05)}
.next-g div{padding:clamp(30px,5vw,60px)}
.next-g h3{font-size:clamp(44px,6vw,84px);line-height:1;margin-top:10px}
.next-g span.l{display:inline-block;margin-top:16px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2)}
@media(max-width:1000px){.masonry{columns:2}}
@media(max-width:560px){.masonry{columns:2;column-gap:8px;padding-inline:10px}.ph{margin-bottom:8px;min-height:160px}}

/* ---------- Lightbox ---------- */
.lb{position:fixed;inset:0;z-index:200;background:rgba(6,6,5,.97);display:none;align-items:center;justify-content:center;padding:70px 76px 56px;touch-action:pan-y}
.lb.open{display:flex;animation:lbIn .35s ease both}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
.lb figure{margin:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.lb img{max-width:100%;max-height:100%;min-height:0;object-fit:contain;opacity:0;transition:opacity .35s;user-select:none;-webkit-user-drag:none}
.lb img.on{opacity:1}
.lb figcaption{font-size:12px;color:var(--muted);letter-spacing:.06em;text-align:center;min-height:18px}
.lb button{position:absolute;background:rgba(14,13,12,.6);border:1px solid #6b5c43;color:var(--ink);border-radius:50%;width:48px;height:48px;font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:.25s}
.lb button:hover{background:var(--gold);color:#13100c;border-color:var(--gold)}
.lb .x{right:22px;top:18px}.lb .pv{left:18px;top:50%;margin-top:-24px}.lb .nx{right:18px;top:50%;margin-top:-24px}
.lb.single .pv,.lb.single .nx,.lb.single .ct{display:none}
.ct{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.24em;color:#b7a98d}
@media(max-width:700px){.lb{padding:64px 10px 52px}.lb .pv,.lb .nx{top:auto;bottom:6px;margin:0;width:42px;height:42px}.lb .pv{left:14px}.lb .nx{right:14px}.lb .x{right:12px;top:12px}}

/* ---------- Stories page ---------- */
.eps{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;padding:10px var(--pad) 110px;max-width:1500px;margin:0 auto}
.ep{background:var(--bg2);border:1px solid var(--line)}
.vid{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.vid iframe,.vid button{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid button{cursor:pointer;background:#0b0a09;padding:0}
.vid button img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--ease),opacity .4s;opacity:.88}
.vid button:hover img{transform:scale(1.04);opacity:1}
.play{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(14,13,12,.72);border:1px solid var(--gold);display:grid;place-items:center;transition:.3s;backdrop-filter:blur(4px)}
.play::before{content:"";margin-left:5px;border-left:20px solid var(--gold);border-top:12px solid transparent;border-bottom:12px solid transparent;transition:.3s}
.vid button:hover .play{background:var(--gold)}
.vid button:hover .play::before{border-left-color:#13100c}
.ep-i{padding:22px 24px 26px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.ep-i h3{font-size:clamp(28px,2.6vw,36px);margin-top:8px;line-height:1.05}
.yt{font-size:11px;letter-spacing:.1em;color:var(--gold);white-space:nowrap}
.yt:hover{text-decoration:underline;text-underline-offset:4px}
@media(max-width:800px){.eps{grid-template-columns:1fr;gap:20px;padding-bottom:80px}}

/* ---------- Shop page ---------- */
.anchors{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 var(--pad) 50px}
.obra{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(30px,5.5vw,84px);max-width:1380px;margin:0 auto;padding:clamp(50px,7vw,90px) var(--pad);border-top:1px solid var(--line);scroll-margin-top:var(--hh)}
.obra-fig{position:sticky;top:calc(var(--hh) + 24px);align-self:start}
.obra-fig button{display:block;width:100%;background:var(--bg3);border:1px solid var(--line);padding:clamp(14px,2vw,28px);cursor:zoom-in;transition:border-color .3s}
.obra-fig button:hover{border-color:var(--gold)}
.obra-fig img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;margin:0 auto;box-shadow:0 22px 60px #000b}
.obra-fig small{display:block;text-align:center;margin-top:14px;font-size:11px;color:#8d857a;letter-spacing:.06em}
.obra-body h2{font-size:clamp(52px,7vw,100px);line-height:.95;margin:14px 0 10px}
.tagline{font:italic 300 clamp(22px,2.3vw,30px) var(--serif);color:var(--gold);margin-bottom:28px}
.badge{display:inline-block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#13100c;background:var(--gold2);padding:7px 12px;margin-bottom:22px}
.story p{color:#c9c1b4;font-size:15.5px;line-height:1.95;margin-bottom:16px}
.story .src{font-size:12px;color:#8d857a;line-height:1.7}
.obra .vid{margin:26px 0 8px;border:1px solid var(--line)}
.ytl{display:inline-block;margin-bottom:26px;font-size:12px;color:var(--gold)}
.ytl:hover{text-decoration:underline;text-underline-offset:4px}
.specs{list-style:none;margin:26px 0;padding:0;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);background:#1a1713}
.specs li{padding:16px 20px;font-size:13px;line-height:1.6;color:#cdc3b3;border-bottom:1px solid var(--line)}
.specs li:nth-child(odd){border-right:1px solid var(--line)}
.specs li:nth-last-child(-n+2){border-bottom:0}
.specs b{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
.offers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.offers.one{grid-template-columns:1fr}
.offer{border:1px solid var(--line2);background:linear-gradient(160deg,#211d17,#171512);padding:clamp(24px,3vw,36px);display:flex;flex-direction:column}
.offer h3{font-size:34px;margin:12px 0 6px;line-height:1.05}
.price{font-size:clamp(36px,4vw,46px);color:#ead4ad;font-weight:600;line-height:1.1;margin:8px 0 14px}
.price small{font-size:18px;font-weight:600}
.price s{display:block;font-size:15px;font-weight:500;color:#8d857a;margin-bottom:2px}
.offer ul{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:9px;color:#c9c0b2;font-size:13.5px;line-height:1.65;flex:1}
.offer li{padding-left:22px;position:relative}
.offer li::before{content:"";position:absolute;left:0;top:.62em;width:9px;height:1px;background:var(--gold)}
.quality{background:var(--bg2);border-block:1px solid var(--line);text-align:center}
.quality h2{font-size:clamp(44px,5.8vw,80px);line-height:1;margin:16px 0 10px}
.quality p{max-width:860px;margin:18px auto 0;color:#b9b0a2;line-height:1.95}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1100px;margin:46px auto 0;text-align:left}
.steps div{border:1px solid var(--line2);padding:26px;background:#181512}
.steps i{font:300 44px/1 var(--serif);color:var(--gold);font-style:normal}
.steps h4{margin:14px 0 8px;font:600 14px var(--sans);color:var(--ink)}
.steps p{margin:0;font-size:13px;line-height:1.75;color:#aaa294}
@media(max-width:900px){
  .obra{grid-template-columns:1fr}
  .obra-fig{position:static}
  .obra-fig img{max-height:70vh}
  .offers{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
}
@media(max-width:520px){.specs{grid-template-columns:1fr}.specs li:nth-child(odd){border-right:0}.specs li:nth-last-child(2){border-bottom:1px solid var(--line)}}

/* floating whatsapp */
.wa{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;align-items:center;gap:10px;background:var(--gold);color:#13100c;padding:13px 18px 13px 14px;border-radius:40px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 10px 30px #000a;transition:transform .3s var(--ease),opacity .3s}
.wa:hover{transform:translateY(-3px)}
.wa svg{width:22px;height:22px;fill:currentColor}
@media(max-width:560px){.wa span{display:none}.wa{padding:14px}}
noscript{display:block;padding:140px var(--pad);text-align:center}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .rv{opacity:1;transform:none}
}
</style>

const MULTI=!!window.__PAGE;
function map(h){
  const p=h.slice(2).split('/');
  if(p[0]==='')return 'index.html';
  if(p[0]==='portfolio')return 'index.html#galerias';
  if(p[0]==='fotografo')return 'index.html#fotografo';
  if(p[0]==='contato')return 'index.html#contato';
  if(p[0]==='galeria')return p[1]+'.html';
  if(p[0]==='historias')return 'contando-historias.html';
  if(p[0]==='loja')return 'loja-fine-art.html'+(p[1]?'#obra-'+p[1]:'');
  return h;
}
const U=h=>MULTI&&h.startsWith('#/')?map(h):h;
const fixLinks=root=>{if(MULTI)$$('a[href^="#/"]',root).forEach(a=>a.setAttribute('href',map(a.getAttribute('href'))))};

/* ---------- Router ---------- */
const app=$('#app'); let view='';
function setTitle(t){document.title=t?`${t} | ${BASE_TITLE}`:`${BASE_TITLE} | O olhar que permanece`}
function setNav(r){$$('#nav a[data-r]').forEach(a=>a.toggleAttribute('aria-current',false)||(a.dataset.r===r&&a.setAttribute('aria-current','page')))}
function scrollToId(id,smooth){const el=document.getElementById(id);if(!el)return false;el.scrollIntoView({behavior:smooth?'smooth':'instant',block:'start'});return true}
const toTop=smooth=>scrollTo({top:0,behavior:smooth?'smooth':'instant'});
function route(){
  closeMenu();
  const [a='',b='']=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/');
  let key,html,after,title='',nav='';
  if(a===''||a==='portfolio'||a==='fotografo'||a==='contato'){
    key='home';nav=a==='portfolio'?'portfolio':a==='fotografo'?'fotografo':'';
    const target={'':null,portfolio:'galerias',fotografo:'fotografo',contato:'contato'}[a];
    if(view==='home'){ if(target)scrollToId(target,true);else toTop(true); setNav(nav); return; }
    html=home();after=()=>{initCarousel();if(target)requestAnimationFrame(()=>scrollToId(target,false))};
  }else if(a==='galeria'&&GALS.some(g=>g.slug===b)){
    key='g:'+b;title=GALS.find(g=>g.slug===b).n;nav='portfolio';html=gallery(b);after=initGallery;
  }else if(a==='historias'){key='historias';title='Contando Histórias';nav='historias';html=stories();after=()=>{};}
  else if(a==='loja'){
    key='loja';title='Loja Fine Art';nav='loja';
    if(view==='loja'){ if(b)scrollToId('obra-'+b,true);else toTop(true); return; }
    html=shop();after=()=>{if(b)requestAnimationFrame(()=>scrollToId('obra-'+b,false))};
  }else{location.hash='#/';return}
  view=key;app.innerHTML=html;setTitle(title);setNav(nav);
  const noAnchor=!(after&&(key==='home'&&a!==''||key==='loja'&&b));
  if(noAnchor)toTop(false);
  after();initReveal();onScroll();
}
function initReveal(){
  const els=$$('.rv',app);
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px',threshold:.05});
  els.forEach(e=>io.observe(e));
}

/* ---------- Header / menu ---------- */
const hdr=$('#hdr'),burger=$('#burger'),nav=$('#nav');
function onScroll(){hdr.classList.toggle('solid',scrollY>30||view!=='home')}
addEventListener('scroll',onScroll,{passive:true});
function closeMenu(){nav.classList.remove('open');burger.setAttribute('aria-expanded','false');burger.setAttribute('aria-label','Abrir menu');document.body.classList.remove('lock')}
burger.addEventListener('click',()=>{const o=!nav.classList.contains('open');nav.classList.toggle('open',o);burger.setAttribute('aria-expanded',o);burger.setAttribute('aria-label',o?'Fechar menu':'Abrir menu');document.body.classList.toggle('lock',o)});
nav.addEventListener('click',e=>{if(e.target.closest('a'))closeMenu()});
$('#navWa').href=WA_GENERAL;$('#waFloat').href=WA_GENERAL;
$('#foot').innerHTML=footer();fixLinks(document);

/* ---------- 3D carousel ---------- */
function initCarousel(){
  const stage=$('#stage');if(!stage)return;
  const cards=$$('.card3',stage),dots=$$('.dot'),n=cards.length;
  let a=0,sx=null,sy=0,drag=false;
  function show(i){
    a=(i+n)%n;
    cards.forEach((c,j)=>{let d=(j-a+n)%n;if(d>n/2)d-=n;c.dataset.pos=d;c.tabIndex=d===0?0:-1;c.setAttribute('aria-current',d===0?'true':'false')});
    dots.forEach((d,j)=>d.classList.toggle('on',j===a));
    const o=OBRAS[a];$('#capT').textContent=o.t;$('#capS').textContent=o.tag;$('#capL').setAttribute('href',U('#/loja/'+o.id));
  }
  $('#aPrev').onclick=()=>show(a-1);$('#aNext').onclick=()=>show(a+1);
  dots.forEach((d,j)=>d.onclick=()=>show(j));
  cards.forEach((c,j)=>c.addEventListener('click',e=>{if(drag){e.preventDefault();return}if(j!==a){e.preventDefault();show(j)}}));
  stage.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;sx=e.clientX;sy=e.clientY;drag=false;stage.classList.add('dragging')});
  const end=e=>{stage.classList.remove('dragging');if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){drag=true;show(a+(dx<0?1:-1));setTimeout(()=>drag=false,260)}sx=null};
  stage.addEventListener('pointerup',end);
  stage.addEventListener('pointercancel',()=>{sx=null;stage.classList.remove('dragging')});
  stage.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(a+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(a-1)}});
  show(0);
}

/* ---------- Gallery + Lightbox ---------- */
function initGallery(){
  const mas=$('#mas');if(!mas)return;
  const mark=img=>{const b=img.closest('.ph');if(!b)return;if(img.naturalWidth){b.classList.add('ok')}else{b.classList.add('bad')}};
  mas.addEventListener('load',e=>{if(e.target.tagName==='IMG')e.target.closest('.ph').classList.add('ok')},true);
  mas.addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.closest('.ph').classList.add('bad')},true);
  $$('img',mas).forEach(i=>{if(i.complete)mark(i)});
  const g=GALS.find(x=>x.slug===mas.dataset.g);
  mas.addEventListener('click',e=>{
    const b=e.target.closest('.ph');if(!b||b.classList.contains('bad'))return;
    LB.open(g.files.map(f=>({src:`imagens/${g.slug}/${encodeURI(f)}`,cap:g.n})),+b.dataset.i,b);
  });
}
const LB=(()=>{
  const el=$('#lb'),img=$('#lbImg'),cap=$('#lbCap'),ct=$('#lbCt');
  let list=[],i=0,opener=null,sx=null,sy=0;
  function show(k){
    i=(k+list.length)%list.length;const it=list[i];
    img.classList.remove('on');
    img.onload=()=>img.classList.add('on');
    img.onerror=()=>{img.classList.add('on');cap.textContent='Fotografia indisponível'};
    img.src=it.src;img.alt=`${it.cap} — fotografia ${i+1} de ${list.length}`;
    cap.textContent=list.length>1?it.cap:it.cap;ct.textContent=`${i+1} / ${list.length}`;
    if(list.length>1)[1,-1].forEach(d=>{const p=new Image();p.src=list[(i+d+list.length)%list.length].src});
  }
  function open(l,k,from){list=l;opener=from||document.activeElement;el.classList.toggle('single',l.length<2);el.classList.add('open');document.body.classList.add('lock');show(k);$('.x',el).focus()}
  function close(){el.classList.remove('open');document.body.classList.remove('lock');img.removeAttribute('src');if(opener&&opener.focus)opener.focus()}
  el.addEventListener('click',e=>{const a=e.target.closest('[data-lb]');if(a){const v=a.dataset.lb;if(v==='x')close();if(v==='p')show(i-1);if(v==='n')show(i+1);return}if(e.target===el||e.target.tagName==='FIGURE')close()});
  document.addEventListener('keydown',e=>{
    if(!el.classList.contains('open'))return;
    if(e.key==='Escape')close();
    if(e.key==='ArrowRight'&&list.length>1)show(i+1);
    if(e.key==='ArrowLeft'&&list.length>1)show(i-1);
    if(e.key==='Tab'){const f=$$('button',el).filter(b=>getComputedStyle(b).display!=='none');const idx=f.indexOf(document.activeElement);e.preventDefault();f[(idx+(e.shiftKey?-1:1)+f.length)%f.length].focus()}
  });
  el.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
  el.addEventListener('pointerup',e=>{if(sx==null||list.length<2)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)show(i+(dx<0?1:-1))});
  return{open,close};
})();

/* ---------- Delegated: video facade + zoom ---------- */
document.addEventListener('click',e=>{
  const v=e.target.closest('.vid button');
  if(v){const w=v.parentElement,id=w.dataset.vid;w.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="Vídeo" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;return}
  const z=e.target.closest('[data-zoom]');
  if(z){LB.open([{src:IMG[z.dataset.zoom].uri,cap:z.dataset.cap}],0,z)}
});

function routeMulti(){
  const P=window.__PAGE;let html,after=()=>{},title='',nav='';
  if(P==='home'){html=home();after=()=>{initCarousel();const id=location.hash.slice(1);if(id)requestAnimationFrame(()=>scrollToId(id,false))}}
  else if(P==='historias'){html=stories();title='Contando Histórias';nav='historias'}
  else if(P==='loja'){html=shop();title='Loja Fine Art';nav='loja';after=()=>{const id=location.hash.slice(1);if(id)requestAnimationFrame(()=>scrollToId(id,false))}}
  else{html=gallery(P);title=GALS.find(g=>g.slug===P).n;nav='portfolio'}
  view=P==='home'?'home':P;app.innerHTML=html;fixLinks(app);setTitle(title);setNav(nav);after();initReveal();onScroll();
  if(P.length&&P!=='home'&&P!=='loja')initGallery();
}
if(MULTI){routeMulti()}else{addEventListener('hashchange',route);route()}
})();
