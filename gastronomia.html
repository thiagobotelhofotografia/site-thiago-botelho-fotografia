ter{position:absolute;bottom:15px;color:#b7a98d;font-size:11px;letter-spacing:.2em}footer{border-top:1px solid #383027;padding:30px 6vw;color:#a89b8b;font-size:12px;display:flex;justify-content:space-between}@media(max-width:850px){.gallery{columns:2;gap:12px;padding:0 14px 70px}.photo{margin-bottom:12px}header{padding:20px}nav{gap:12px;font-size:10px}.brand{font-size:20px}.lightbox{padding:60px 38px}}@media(max-width:520px){.gallery{columns:1;padding:0 18px 65px}.intro{padding:58px 22px 48px}footer{display:block;line-height:2}.lightbox{padding:70px 30px}#prev{left:3px}#next{right:3px}}.return-links{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;padding:0 20px 65px}.return-links a{display:inline-block;padding:15px 22px;border:1px solid #c7aa7b;color:#c7aa7b;text-transform:uppercase;font-size:11px;letter-spacing:.12em}.return-links a:hover{background:#c7aa7b;color:#11100f}</style></head><body><header><a class="brand" href="index.html">THIAGO BOTELHO<small>FOTOGRAFIA</small></a><nav><a href="index.html#galerias">Portfólio</a><a href="index.html#fineart">Loja Fine Art</a><a href="https://wa.me/5586988862416">Contato</a></nav></header><section class="intro"><div class="eyebrow">Portfólio / Coleção fotográfica</div><h1>Gastronomia</h1><p>Texturas, cores e composições que revelam a beleza da gastronomia.</p></section><main class="gallery"><button aria-label="Ampliar fotografia 1" class="photo" data-index="0"><img alt="Gastronomia — fotografia 1 de Thiago Botelho" loading="lazy" src="imagens/gastronomia/IMG_7299.jpg"/></button><button aria-label="Ampliar fotografia 2" class="photo" data-index="1"><img alt="Gastronomia — fotografia 2 de Thiago Botelho" loading="lazy" src="imagens/gastronomia/IMG_7298.jpg"/></button><button aria-label="Ampliar fotografia 3" class="photo" data-index="2"><img alt="Gastronomia — fotografia 3 de Thiago Botelho" loading="lazy" src="imagens/gastronomia/IMG_7423.jpg"/></button><button aria-label="Ampliar fotografia 4" class="photo" data-index="3"><img alt="Gastronomia — fotografia 4 de Thiago Botelho" loading="lazy" src="imagens/gastronomia/IMG_8122.jpg"/></button><button aria-label="Ampliar fotografia 5" class="photo" data-index="4"><img alt="Gastronomia — fotografia 5 de Thiago Botelho" loading="lazy" src="imagens/gastronomia/IMG_8177.jpg"/></button><button aria-label="Ampliar fotografia 6" class="photo" data-index="5"><img alt="Gastronomia — fotografia 6 de Thiago Botelho" loading="lazy" src="imagens/gastronomia/IMG_8237.jpg"/></button><button aria-label="Ampliar fotografia 7" class="photo" data-index="6"><img alt="Gastronomia — fotografia 7 de Thiago Botelho" loading="lazy" src="imagens/gastronomia/IMG_8399.jpg"/></button><button aria-label="Ampliar fotografia 8" class="photo" data-index="7"><img alt="Gastronomia — fotografia 8 de Thiago Botelho" loading="lazy" src="imagens/gastronomia/IMG_6805.jpg"/></button><button aria-label="Ampliar fotografia 9" class="photo" data-index="8"><img alt="Gastronomia — fotografia 9 de Thiago Botelho" loading="lazy" src="imagens/gastronomia/IMG_6785.jpg"/></button><button aria-label="Ampliar fotografia 10" class="photo" data-index="9"><img alt="Gastronomia — fotografia 10 de Thiago Botelho" loading="lazy" src="imagens/gastronomia/IMG_6001.jpg"/></button></main><div aria-label="Visualização ampliada" aria-modal="true" class="lightbox" id="lightbox" role="dialog"><button aria-label="Fechar" id="close">×</button><button aria-label="Anterior" id="prev">‹</button><img alt="Fotografia ampliada" id="large"/><button aria-label="Próxima" id="next">›</button><div class="counter" id="counter"></div></div><nav class="return-links" aria-label="Navegação do portfólio"><a href="index.html">← Página inicial</a><a href="index.html#galerias">← Voltar ao portfólio</a></nav><footer><span>© Thiago Botelho Fotografia</span><a href="index.html#galerias">← Voltar ao portfólio</a></footer><script>const photos=['imagens/gastronomia/IMG_7299.jpg', 'imagens/gastronomia/IMG_7298.jpg', 'imagens/gastronomia/IMG_7423.jpg', 'imagens/gastronomia/IMG_8122.jpg', 'imagens/gastronomia/IMG_8177.jpg', 'imagens/gastronomia/IMG_8237.jpg', 'imagens/gastronomia/IMG_8399.jpg', 'imagens/gastronomia/IMG_6805.jpg', 'imagens/gastronomia/IMG_6785.jpg', 'imagens/gastronomia/IMG_6001.jpg'];let index=0;const lb=document.getElementById('lightbox');function show(i){index=(i+photos.length)%photos.length;document.getElementById('large').src=photos[index];document.getElementById('counter').textContent=`${index+1} / ${photos.length}`;lb.classList.add('open');document.body.style.overflow='hidden'}function close(){lb.classList.remove('open');document.body.style.overflow=''}document.querySelectorAll('.photo').forEach((b,i)=>b.addEventListener('click',()=>show(i)));document.getElementById('close').onclick=close;document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);lb.addEventListener('click',e=>{if(e.target===lb)close()});document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')show(index+1);if(e.key==='ArrowLeft')show(index-1)});</script></body></html>
