<!DOCTYPE html>

<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Gastronomia | Thiago Botelho Fotografia</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&amp;family=Manrope:wght@400;500&amp;display=swap" rel="stylesheet"/><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#11100f;color:#eee9df;font-family:Manrope,Arial,sans-serif}a{color:inherit;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;padding:26px 6vw;border-bottom:1px solid #383027}.brand{font:26px 'Cormorant Garamond',serif;letter-spacing:.14em}.brand small{display:block;font:9px Manrope,sans-serif;letter-spacing:.3em;color:#c7aa7b}nav{display:flex;gap:25px;font-size:11px;letter-spacing:.13em;text-transform:uppercase}nav a:hover{color:#c7aa7b}.intro{text-align:center;padding:85px 22px 65px}.eyebrow{color:#c7aa7b;font-size:10px;letter-spacing:.3em;text-transform:uppercase}h1{font:400 clamp(65px,10vw,140px)/1 'Cormorant Garamond',serif;margin:18px 0 12px}.intro p{font-size:13px;line-height:1.8;color:#b8aea0;max-width:600px;margin:0 auto}.gallery{max-width:1600px;padding:0 4vw 110px;margin:auto;columns:3;column-gap:19px}.photo{background:#1d1b18;border:0;display:block;width:100%;margin:0 0 19px;padding:0;break-inside:avoid;cursor:zoom-in;overflow:hidden}.photo img{display:block;width:100%;height:auto;transition:transform .5s ease}.photo:hover img{transform:scale(1.035)}.lightbox{position:fixed;inset:0;background:rgba(7,7,7,.97);z-index:100;display:none;align-items:center;justify-content:center;padding:65px 65px 45px}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:100%;object-fit:contain}.lightbox button{position:absolute;background:transparent;color:#eee;border:1px solid #706452;border-radius:50%;width:43px;height:43px;font-size:25px;cursor:pointer}#close{right:24px;top:20px}#prev{left:13px}#next{right:13px}.counter{position:absolute;bottom:15px;color:#b7a98d;font-size:11px;letter-spacing:.2em}footer{border-top:1px solid #383027;padding:30px 6vw;color:#a89b8b;font-size:12px;display:flex;justify-content:space-between}@media(max-width:850px){.gallery{columns:2;gap:12px;padding:0 14px 70px}.photo{margin-bottom:12px}header{padding:20px}nav{gap:12px;font-size:10px}.brand{font-size:20px}.lightbox{padding:60px 38px}}@media(max-width:520px){.gallery{columns:1;padding:0 18px 65px}.intro{padding:58px 22px 48px}footer{display:block;line-height:2}.lightbox{padding:70px 30px}#prev{left:3px}#next{right:3px}}</style></head><body><header><a class="brand" href="index.html">THIAGO BOTELHO<small>FOTOGRAFIA</small></a><nav><a href="index.html#galerias">Portfólio</a><a href="index.html#fineart">Loja Fine Art</a><a href="https://wa.me/5586988862416">Contato</a></nav></header><section class="intro"><div class="eyebrow">Portfólio / Coleção fotográfica</div><h1>Gastronomia</h1><p>Texturas, cores e composições que revelam a beleza da gastronomia.</p></section><main class="gallery"><button aria-label="Ampliar fotografia 1" class="photo" data-index="0"><img alt="Fotografia gastronômica 1 — Thiago Botelho" loading="lazy" src="imagens/gastronomia/cookies-jacqueline-1.jpg"/></button><button aria-label="Ampliar fotografia 2" class="photo" data-index="1"><img alt="Fotografia gastronômica 2 — Thiago Botelho" loading="lazy" src="imagens/gastronomia/pao-geleia.jpg"/></button><button aria-label="Ampliar fotografia 3" class="photo" data-index="2"><img alt="Fotografia gastronômica 3 — Thiago Botelho" loading="lazy" src="imagens/gastronomia/preparo-alface.jpg"/></button><button aria-label="Ampliar fotografia 4" class="photo" data-index="3"><img alt="Fotografia gastronômica 4 — Thiago Botelho" loading="lazy" src="imagens/gastronomia/preparo-torta.jpg"/></button><button aria-label="Ampliar fotografia 5" class="photo" data-index="4"><img alt="Fotografia gastronômica 5 — Thiago Botelho" loading="lazy" src="imagens/gastronomia/salada-caprese.jpg"/></button><button aria-label="Ampliar fotografia 6" class="photo" data-index="5"><img alt="Fotografia gastronômica 6 — Thiago Botelho" loading="lazy" src="imagens/gastronomia/torta-coracao.jpg"/></button><button aria-label="Ampliar fotografia 7" class="photo" data-index="6"><img alt="Fotografia gastronômica 7 — Thiago Botelho" loading="lazy" src="imagens/gastronomia/bolo-cerejas-1.jpg"/></button><button aria-label="Ampliar fotografia 8" class="photo" data-index="7"><img alt="Fotografia gastronômica 8 — Thiago Botelho" loading="lazy" src="imagens/gastronomia/bolo-cerejas-2.jpg"/></button><button aria-label="Ampliar fotografia 9" class="photo" data-index="8"><img alt="Fotografia gastronômica 9 — Thiago Botelho" loading="lazy" src="imagens/gastronomia/bombons-healthy.jpg"/></button><button aria-label="Ampliar fotografia 10" class="photo" data-index="9"><img alt="Fotografia gastronômica 10 — Thiago Botelho" loading="lazy" src="imagens/gastronomia/bombons-jacqueline.jpg"/></button><button aria-label="Ampliar fotografia 11" class="photo" data-index="10"><img alt="Fotografia gastronômica 11 — Thiago Botelho" loading="lazy" src="imagens/gastronomia/cafe-da-manha.jpg"/></button><button aria-label="Ampliar fotografia 12" class="photo" data-index="11"><img alt="Fotografia gastronômica 12 — Thiago Botelho" loading="lazy" src="imagens/gastronomia/cafe-the-coffee.jpg"/></button><button aria-label="Ampliar fotografia 13" class="photo" data-index="12"><img alt="Fotografia gastronômica 13 — Thiago Botelho" loading="lazy" src="imagens/gastronomia/cookies-jacqueline-2.jpg"/></button></main><div aria-label="Visualização ampliada" aria-modal="true" class="lightbox" id="lightbox" role="dialog"><button aria-label="Fechar" id="close">×</button><button aria-label="Anterior" id="prev">‹</button><img alt="Fotografia ampliada" id="large"/><button aria-label="Próxima" id="next">›</button><div class="counter" id="counter"></div></div><footer><span>© Thiago Botelho Fotografia</span><a href="index.html#galerias">← Voltar ao portfólio</a></footer><script>const photos=["imagens/gastronomia/cookies-jacqueline-1.jpg", "imagens/gastronomia/pao-geleia.jpg", "imagens/gastronomia/preparo-alface.jpg", "imagens/gastronomia/preparo-torta.jpg", "imagens/gastronomia/salada-caprese.jpg", "imagens/gastronomia/torta-coracao.jpg", "imagens/gastronomia/bolo-cerejas-1.jpg", "imagens/gastronomia/bolo-cerejas-2.jpg", "imagens/gastronomia/bombons-healthy.jpg", "imagens/gastronomia/bombons-jacqueline.jpg", "imagens/gastronomia/cafe-da-manha.jpg", "imagens/gastronomia/cafe-the-coffee.jpg", "imagens/gastronomia/cookies-jacqueline-2.jpg"];let index=0;const lb=document.getElementById('lightbox');function show(i){index=(i+photos.length)%photos.length;document.getElementById('large').src=photos[index];document.getElementById('counter').textContent=`${index+1} / ${photos.length}`;lb.classList.add('open');document.body.style.overflow='hidden'}function close(){lb.classList.remove('open');document.body.style.overflow=''}document.querySelectorAll('.photo').forEach((b,i)=>b.addEventListener('click',()=>show(i)));document.getElementById('close').onclick=close;document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);lb.addEventListener('click',e=>{if(e.target===lb)close()});document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')show(index+1);if(e.key==='ArrowLeft')show(index-1)});</script></body></html>
